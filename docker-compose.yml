version: '3.8'

services:

  
  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg15
    container_name: multiagent-postgres
    environment:
      POSTGRES_DB: multiagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once on first init (empty volume) — provisions the agno_sessions DB.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - multiagent-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: multiagent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - multiagent-network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: multiagent-api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/multiagent
      REDIS_URL: redis://redis:6379/0
      # Queue lives on a separate Redis DB from the cache (db 0) and every key
      # is namespaced s247:jobs:* -- see app/orchestra/ai/ingestion/jobs/celery_app.py
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # A worker runs in this stack, so hand ingestion to it rather than
      # processing in-process. Local dev without compose stays on "inprocess".
      JOB_BACKEND: celery
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - multiagent-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Adminer — browser-based Postgres UI at http://localhost:8081
  adminer:
    image: adminer:latest
    container_name: multiagent-adminer
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - multiagent-network

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: multiagent-celery-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/multiagent
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JOB_BACKEND: celery
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - multiagent-network
    command: >
      celery -A app.orchestra.ai.ingestion.jobs.celery_app:celery_app worker
      --loglevel=info --queues=s247-ingestion --concurrency=2

volumes:
  postgres_data:
  redis_data:

networks:
  multiagent-network:
    driver: bridge

# Made with Bob
