# Production stack — builds image on the server from source
# Run from repo root: docker compose -f deploy/docker-compose.prod.yml up --build -d

services:

  postgres:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - support247

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - support247

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: always
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:    redis://redis:6379/0
      SCRAPER_QUICK_PROVIDER: ${SCRAPER_QUICK_PROVIDER:-httpx}
      SCRAPER_DEEP_PROVIDER: ${SCRAPER_DEEP_PROVIDER:-firecrawl}
      SCRAPER_DEEP_TIMEOUT_S: ${SCRAPER_DEEP_TIMEOUT_S:-15}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_BASE_URL: ${FIRECRAWL_BASE_URL:-https://api.firecrawl.dev}
      FIRECRAWL_MAX_REQUESTS_PER_SPACE_PER_DAY: ${FIRECRAWL_MAX_REQUESTS_PER_SPACE_PER_DAY:-50}
      FIRECRAWL_MAX_CONCURRENT_REQUESTS: ${FIRECRAWL_MAX_CONCURRENT_REQUESTS:-2}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - support247


volumes:
  postgres_data:
  redis_data:

networks:
  support247:
    driver: bridge
