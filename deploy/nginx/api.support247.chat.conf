# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name api.support247.chat;
    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy → FastAPI on port 8000
server {
    listen 443 ssl;
    server_name api.support247.chat;

    # SSL managed by Certbot — run setup-vps.sh to generate
    ssl_certificate     /etc/letsencrypt/live/api.support247.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.support247.chat/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Allow large file uploads (knowledge base docs)
    client_max_body_size 50M;

    location / {
        proxy_pass         http://localhost:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (for streaming chat)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout 120s;
    }
}
