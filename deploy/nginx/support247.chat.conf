# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name support247.chat www.support247.chat;
    return 301 https://support247.chat$request_uri;
}

# Frontend (React SPA) + API proxy
server {
    listen 443 ssl;
    server_name support247.chat www.support247.chat;

    ssl_certificate     /etc/letsencrypt/live/support247.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support247.chat/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/support247/ui/dist;
    index index.html;

    # Large file uploads (knowledge base docs)
    client_max_body_size 50M;

    # API, auth, org, space routes → FastAPI backend
    location ~ ^/(api|auth|org|space)/ {
        proxy_pass         http://localhost:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE / WebSocket support
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }

    # React SPA — all other paths serve index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
