<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Orchestra — Brand Dashboard</title>
  <style>
    :root {
      --bg: #f1f5f9; --surface: #fff; --border: #e2e8f0;
      --text: #1e293b; --muted: #64748b; --accent: #6366f1;
      --accent-light: #e0e7ff; --danger: #ef4444; --success: #22c55e;
      --warning: #f59e0b; --sidebar-w: 220px;
    }
    [data-theme="dark"] {
      --bg: #0f172a; --surface: #1e293b; --border: #334155;
      --text: #f1f5f9; --muted: #94a3b8; --accent: #818cf8;
      --accent-light: #312e81;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}

    /* ── Sidebar ── */
    #sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
    .sb-logo{padding:20px 16px 12px;font-weight:700;font-size:1.1rem;color:var(--accent);display:flex;align-items:center;gap:8px}
    .sb-logo span{font-size:1.4rem}
    .sb-nav{flex:1;padding:8px 0}
    .sb-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;border-radius:8px;margin:2px 8px;font-size:.875rem;color:var(--muted);transition:.15s}
    .sb-item:hover{background:var(--bg);color:var(--text)}
    .sb-item.active{background:var(--accent-light);color:var(--accent);font-weight:600}
    .sb-item .ico{font-size:1.1rem;width:20px;text-align:center}
    .sb-bottom{padding:12px}
    .sb-brand{font-size:.75rem;color:var(--muted);padding:8px 8px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* ── Main ── */
    #main{flex:1;display:flex;flex-direction:column;overflow:hidden}
    header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
    .hd-title{font-size:1rem;font-weight:600}
    .hd-right{display:flex;align-items:center;gap:12px}
    .btn{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:.8rem;font-weight:500;transition:.15s}
    .btn:hover{background:var(--bg)}
    .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn-primary:hover{opacity:.9}
    .btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}

    #content{flex:1;overflow-y:auto;padding:24px}

    /* ── Cards / Grid ── */
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
    .stat-val{font-size:2rem;font-weight:700;color:var(--accent)}
    .stat-label{font-size:.8rem;color:var(--muted);margin-top:4px}

    /* ── Agents ── */
    .agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
    .agent-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
    .agent-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .agent-icon{font-size:1.6rem}
    .agent-name{font-weight:600;font-size:.9rem}
    .agent-desc{font-size:.8rem;color:var(--muted);margin-bottom:12px}
    .agent-foot{display:flex;align-items:center;justify-content:space-between}
    .badge{font-size:.7rem;padding:2px 8px;border-radius:20px;font-weight:600}
    .badge-on{background:#dcfce7;color:#166534}
    .badge-off{background:#f1f5f9;color:var(--muted)}
    [data-theme="dark"] .badge-on{background:#14532d;color:#86efac}
    [data-theme="dark"] .badge-off{background:#334155;color:var(--muted)}
    .toggle{position:relative;display:inline-block;width:38px;height:22px}
    .toggle input{opacity:0;width:0;height:0}
    .slider{position:absolute;inset:0;background:#cbd5e1;border-radius:22px;cursor:pointer;transition:.2s}
    .slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
    input:checked+.slider{background:var(--accent)}
    input:checked+.slider:before{transform:translateX(16px)}
    input:disabled+.slider{opacity:.5;cursor:default}

    /* ── KB table ── */
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:.85rem}
    th{text-align:left;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border)}
    td{padding:10px 12px;border-bottom:1px solid var(--border)}
    tr:last-child td{border:none}
    .doc-type-tag{font-size:.7rem;padding:2px 7px;border-radius:20px;background:var(--accent-light);color:var(--accent);font-weight:600}

    /* ── Skills ── */
    .skill-list{display:flex;flex-direction:column;gap:8px}
    .skill-item{background:var(--bg);border-radius:8px;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start}
    .skill-type-tag{font-size:.7rem;padding:2px 7px;border-radius:20px;background:#fef3c7;color:#92400e;font-weight:600}
    [data-theme="dark"] .skill-type-tag{background:#451a03;color:#fbbf24}

    /* ── Upload area ── */
    .drop-zone{border:2px dashed var(--border);border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:.15s;color:var(--muted)}
    .drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}

    /* ── Modal ── */
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
    .overlay.open{display:flex}
    .modal{background:var(--surface);border-radius:16px;padding:28px;width:480px;max-height:85vh;overflow-y:auto}
    .modal-title{font-size:1rem;font-weight:700;margin-bottom:20px}
    .form-group{margin-bottom:14px}
    label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:4px}
    input[type=text],input[type=email],input[type=password],select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.875rem;outline:none;font-family:inherit}
    input:focus,select:focus,textarea:focus{border-color:var(--accent)}
    textarea{min-height:80px;resize:vertical}
    .form-row{display:flex;gap:10px}
    .form-row .form-group{flex:1}

    /* ── Notification ── */
    #toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:12px 18px;border-radius:10px;font-size:.85rem;transform:translateY(80px);opacity:0;transition:.3s;z-index:200}
    #toast.show{transform:translateY(0);opacity:1}

    /* ── Analytics ── */
    .analytics-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .bar-chart{display:flex;flex-direction:column;gap:6px}
    .bar-row{display:flex;align-items:center;gap:10px;font-size:.8rem}
    .bar-label{width:100px;text-align:right;color:var(--muted);flex-shrink:0}
    .bar-track{flex:1;background:var(--bg);border-radius:4px;height:10px}
    .bar-fill{height:100%;border-radius:4px;background:var(--accent)}
    .bar-val{width:36px;color:var(--muted)}

    h2{font-size:1rem;font-weight:700;margin-bottom:16px}
    .section-gap{margin-top:24px}
    .flex{display:flex;gap:10px;align-items:center}
    .ml-auto{margin-left:auto}
    .text-muted{color:var(--muted);font-size:.85rem}
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar">
  <div class="sb-logo"><span>🎼</span> Orchestra</div>
  <nav class="sb-nav">
    <div class="sb-item active" data-screen="overview"><span class="ico">📊</span> Overview</div>
    <div class="sb-item" data-screen="agents"><span class="ico">🤖</span> Agents</div>
    <div class="sb-item" data-screen="kb"><span class="ico">📚</span> Knowledge Base</div>
    <div class="sb-item" data-screen="skills"><span class="ico">🧩</span> Prompt Skills</div>
    <div class="sb-item" data-screen="analytics"><span class="ico">📈</span> Analytics</div>
    <div class="sb-item" data-screen="settings"><span class="ico">⚙️</span> Settings</div>
  </nav>
  <div class="sb-bottom">
    <div class="sb-brand" id="brand-slug-label">—</div>
    <button class="btn" style="width:100%;margin-top:6px" onclick="logout()">Sign out</button>
  </div>
</aside>

<!-- Main -->
<div id="main">
  <header>
    <div class="hd-title" id="page-title">Overview</div>
    <div class="hd-right">
      <button class="btn" onclick="toggleTheme()">🌙</button>
      <a id="chat-link" href="#" target="_blank" class="btn btn-primary">Open Chat ↗</a>
    </div>
  </header>
  <div id="content"><!-- injected by JS --></div>
</div>

<!-- Agent create/edit modal -->
<div class="overlay" id="agent-modal">
  <div class="modal">
    <div class="modal-title" id="agent-modal-title">Create Agent</div>
    <div class="form-group"><label>Slug (URL-safe, unique)</label><input type="text" id="ag-slug"/></div>
    <div class="form-row">
      <div class="form-group"><label>Name</label><input type="text" id="ag-name"/></div>
      <div class="form-group"><label>Icon</label><input type="text" id="ag-icon" style="width:60px"/></div>
    </div>
    <div class="form-group"><label>Description</label><input type="text" id="ag-desc"/></div>
    <div class="form-group"><label>System Prompt</label><textarea id="ag-prompt"></textarea></div>
    <div class="form-row">
      <div class="form-group"><label>Temperature</label><input type="text" id="ag-temp" value="0.4"/></div>
      <div class="form-group"><label>Max Tokens</label><input type="text" id="ag-tokens" value="500"/></div>
    </div>
    <div class="form-group">
      <label>RAG Doc Types (comma-separated)</label>
      <input type="text" id="ag-rag-types" placeholder="tech_support,faq"/>
    </div>
    <div class="form-group"><label>Keywords (comma-separated, fallback routing)</label><input type="text" id="ag-keywords"/></div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn ml-auto" onclick="closeModal('agent-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveAgent()">Save</button>
    </div>
  </div>
</div>

<!-- Skill create modal -->
<div class="overlay" id="skill-modal">
  <div class="modal">
    <div class="modal-title">Create Prompt Skill</div>
    <div class="form-group"><label>Name</label><input type="text" id="sk-name"/></div>
    <div class="form-group"><label>Description</label><input type="text" id="sk-desc"/></div>
    <div class="form-group">
      <label>Skill Type</label>
      <select id="sk-type">
        <option value="instruction">instruction — appended to system prompt</option>
        <option value="context">context — prepended to user message</option>
        <option value="format">format — formatting directive</option>
        <option value="rag_filter">rag_filter — RAG doc type filter</option>
      </select>
    </div>
    <div class="form-group"><label>Prompt Text</label><textarea id="sk-text"></textarea></div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn ml-auto" onclick="closeModal('skill-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveSkill()">Save</button>
    </div>
  </div>
</div>

<!-- Upload modal -->
<div class="overlay" id="upload-modal">
  <div class="modal">
    <div class="modal-title">Upload to Knowledge Base</div>
    <div class="form-group">
      <label>Doc Type</label>
      <select id="up-type">
        <option value="tech_support">tech_support</option>
        <option value="faq">faq</option>
        <option value="policy">policy</option>
        <option value="manual">manual</option>
        <option value="contract">contract</option>
        <option value="general">general</option>
      </select>
    </div>
    <div class="drop-zone" id="up-drop" onclick="document.getElementById('up-file').click()">
      <div style="font-size:2rem;margin-bottom:8px">📄</div>
      <div>Drop PDF/TXT files here or click to browse</div>
    </div>
    <input type="file" id="up-file" multiple accept=".pdf,.txt,.md" style="display:none" onchange="onFilePick(this.files)"/>
    <div id="up-staged" style="margin-top:12px;display:flex;flex-direction:column;gap:6px"></div>
    <div id="up-progress" style="display:none;margin-top:12px">
      <div style="height:6px;background:var(--border);border-radius:3px">
        <div id="up-bar" style="height:100%;width:0%;background:var(--accent);border-radius:3px;transition:.3s"></div>
      </div>
      <div id="up-status" style="font-size:.75rem;color:var(--muted);margin-top:4px"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn ml-auto" onclick="closeModal('upload-modal')">Cancel</button>
      <button class="btn btn-primary" id="up-btn" onclick="doUpload()">Upload</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
const API = "/api/v1";
let token = localStorage.getItem("orchestra_token") || "";
let brandSlug = localStorage.getItem("orchestra_slug") || "";
let currentScreen = "overview";
let agents = [], skills = [], kbDocs = [], analytics = {};
let editingAgentSlug = null;
let stagedFiles = [];

// ── Auth guard ────────────────────────────────────────────────────────────────
if (!token) { window.location.href = "/org/login"; }

async function apiFetch(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json", ...(opts.headers || {}) },
  });
  if (res.status === 401) { logout(); return null; }
  return res;
}

function logout() {
  localStorage.removeItem("orchestra_token");
  localStorage.removeItem("orchestra_slug");
  window.location.href = "/org/login";
}

// ── Theme ─────────────────────────────────────────────────────────────────────
const savedTheme = localStorage.getItem("theme") || "light";
document.documentElement.setAttribute("data-theme", savedTheme);

function toggleTheme() {
  const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem("theme", t);
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg, dur = 3000) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), dur);
}

// ── Navigation ────────────────────────────────────────────────────────────────
document.querySelectorAll(".sb-item").forEach(el => {
  el.addEventListener("click", () => {
    document.querySelectorAll(".sb-item").forEach(i => i.classList.remove("active"));
    el.classList.add("active");
    currentScreen = el.dataset.screen;
    document.getElementById("page-title").textContent = el.textContent.trim();
    renderScreen();
  });
});

function renderScreen() {
  const c = document.getElementById("content");
  switch (currentScreen) {
    case "overview":   c.innerHTML = renderOverview(); break;
    case "agents":     c.innerHTML = renderAgents(); break;
    case "kb":         c.innerHTML = renderKB(); break;
    case "skills":     c.innerHTML = renderSkills(); break;
    case "analytics":  c.innerHTML = renderAnalytics(); break;
    case "settings":   c.innerHTML = renderSettings(); break;
  }
  attachHandlers();
}

// ── Load data ─────────────────────────────────────────────────────────────────
async function loadAll() {
  // Me
  const meRes = await apiFetch("/auth/me");
  if (!meRes) return;
  const me = await meRes.json();
  brandSlug = me.slug;
  localStorage.setItem("orchestra_slug", brandSlug);
  document.getElementById("brand-slug-label").textContent = me.display_name || me.slug;
  const chatLink = document.getElementById("chat-link");
  if (chatLink) chatLink.href = `/${brandSlug}`;

  // Agents
  const agRes = await apiFetch("/dashboard/agents");
  if (agRes && agRes.ok) agents = await agRes.json();

  // Skills
  const skRes = await apiFetch("/dashboard/skills");
  if (skRes && skRes.ok) skills = await skRes.json();

  // KB docs
  const kbRes = await apiFetch(`/admin/clients/${brandSlug}/knowledge-base`);
  if (kbRes && kbRes.ok) kbDocs = await kbRes.json();

  // Analytics
  const anRes = await apiFetch("/dashboard/analytics?days=7");
  if (anRes && anRes.ok) analytics = await anRes.json();

  renderScreen();
}

// ── Screens ───────────────────────────────────────────────────────────────────

function renderOverview() {
  const total = analytics.total_messages || 0;
  const rag = analytics.rag_hits || 0;
  const ms = analytics.avg_response_ms ? `${analytics.avg_response_ms}ms` : "—";
  const active = agents.filter(a => a.active).length;
  return `
    <div class="grid4" style="margin-bottom:20px">
      <div class="card"><div class="stat-val">${total}</div><div class="stat-label">Messages (7d)</div></div>
      <div class="card"><div class="stat-val">${rag}</div><div class="stat-label">RAG Hits</div></div>
      <div class="card"><div class="stat-val">${ms}</div><div class="stat-label">Avg Response</div></div>
      <div class="card"><div class="stat-val">${active}</div><div class="stat-label">Active Agents</div></div>
    </div>
    <h2>Agent Fleet</h2>
    <div class="agent-grid">
      ${agents.map(a => agentCard(a, false)).join("")}
    </div>`;
}

function agentCard(a, showEdit = true) {
  const locked = a.slug === "triage";
  return `
    <div class="agent-card">
      <div class="agent-head">
        <div class="agent-icon">${a.icon || "🤖"}</div>
        <div>
          <div class="agent-name">${a.name}</div>
          <span class="badge ${a.active ? "badge-on" : "badge-off"}">${a.active ? "Active" : "Inactive"}</span>
        </div>
        <label class="toggle" style="margin-left:auto">
          <input type="checkbox" ${a.active ? "checked" : ""} ${locked ? "disabled" : ""} onchange="toggleAgent('${a.slug}', this.checked)"/>
          <span class="slider"></span>
        </label>
      </div>
      <div class="agent-desc">${a.description || ""}</div>
      <div class="agent-foot">
        <span class="text-muted" style="font-size:.75rem">${a.agent_type}</span>
        ${showEdit && !a.is_builtin ? `<button class="btn" style="font-size:.75rem;padding:4px 10px" onclick="editAgent('${a.slug}')">Edit</button>` : ""}
        ${showEdit && !a.is_builtin ? `<button class="btn btn-danger" style="font-size:.75rem;padding:4px 10px" onclick="deleteAgent('${a.slug}')">Delete</button>` : ""}
      </div>
    </div>`;
}

function renderAgents() {
  return `
    <div class="flex" style="margin-bottom:20px">
      <h2 style="margin:0">Agents</h2>
      <button class="btn btn-primary ml-auto" onclick="openCreateAgent()">+ New Agent</button>
    </div>
    <div class="agent-grid">${agents.map(a => agentCard(a, true)).join("")}</div>`;
}

function renderKB() {
  const rows = kbDocs.map(d => `
    <tr>
      <td>${d.filename || d.doc_id}</td>
      <td><span class="doc-type-tag">${d.doc_type || "general"}</span></td>
      <td>${d.chunk_count || "—"}</td>
      <td>${d.created_at ? new Date(d.created_at).toLocaleDateString() : "—"}</td>
      <td><button class="btn btn-danger" style="font-size:.75rem;padding:3px 8px" onclick="deleteDoc('${d.doc_id}')">Delete</button></td>
    </tr>`).join("") || `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:24px">No documents yet</td></tr>`;
  return `
    <div class="flex" style="margin-bottom:20px">
      <h2 style="margin:0">Knowledge Base</h2>
      <button class="btn btn-primary ml-auto" onclick="openUpload()">+ Upload</button>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table><thead><tr><th>File</th><th>Type</th><th>Chunks</th><th>Uploaded</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>`;
}

function renderSkills() {
  const items = skills.map(s => `
    <div class="skill-item">
      <div>
        <div style="font-weight:600;font-size:.875rem;margin-bottom:4px">${s.name} <span class="skill-type-tag">${s.skill_type}</span></div>
        <div style="font-size:.8rem;color:var(--muted)">${s.description || ""}</div>
        <div style="font-size:.8rem;margin-top:6px;font-family:monospace;background:var(--border);border-radius:4px;padding:4px 8px;max-height:60px;overflow:hidden">${s.prompt_text.substring(0, 120)}${s.prompt_text.length > 120 ? "…" : ""}</div>
      </div>
      <button class="btn btn-danger" style="font-size:.75rem;padding:3px 8px;margin-left:10px;flex-shrink:0" onclick="deleteSkill('${s.id}')">Delete</button>
    </div>`).join("") || `<div style="color:var(--muted);padding:20px 0">No skills yet.</div>`;
  return `
    <div class="flex" style="margin-bottom:20px">
      <h2 style="margin:0">Prompt Skills</h2>
      <button class="btn btn-primary ml-auto" onclick="document.getElementById('skill-modal').classList.add('open')">+ New Skill</button>
    </div>
    <div class="card"><div class="skill-list">${items}</div></div>`;
}

function renderAnalytics() {
  const intents = analytics.intent_distribution || {};
  const agentDist = analytics.agent_distribution || {};
  const maxI = Math.max(...Object.values(intents), 1);
  const maxA = Math.max(...Object.values(agentDist), 1);
  const intentBars = Object.entries(intents).map(([k,v]) => `
    <div class="bar-row">
      <div class="bar-label">${k}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxI*100)}%"></div></div>
      <div class="bar-val">${v}</div>
    </div>`).join("") || "<div class='text-muted'>No data yet.</div>";
  const agentBars = Object.entries(agentDist).map(([k,v]) => `
    <div class="bar-row">
      <div class="bar-label">${k}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/maxA*100)}%"></div></div>
      <div class="bar-val">${v}</div>
    </div>`).join("") || "<div class='text-muted'>No data yet.</div>";
  return `
    <h2>Analytics — Last 7 days</h2>
    <div class="analytics-row">
      <div class="card"><h2>Intent Distribution</h2><div class="bar-chart">${intentBars}</div></div>
      <div class="card"><h2>Agent Distribution</h2><div class="bar-chart">${agentBars}</div></div>
    </div>`;
}

function renderSettings() {
  return `
    <h2>Settings</h2>
    <div class="card" style="max-width:480px">
      <div class="form-group"><label>Display Name</label><input type="text" id="set-name"/></div>
      <div class="form-group"><label>Theme Color</label><input type="text" id="set-color" placeholder="#6366f1"/></div>
      <div class="form-group"><label>Logo URL</label><input type="text" id="set-logo"/></div>
      <button class="btn btn-primary" onclick="saveProfile()">Save</button>
    </div>`;
}

function attachHandlers() {
  // populate settings
  if (currentScreen === "settings") {
    apiFetch("/auth/me").then(r => r && r.json()).then(me => {
      if (!me) return;
      document.getElementById("set-name").value = me.display_name || "";
      document.getElementById("set-color").value = me.theme_color || "";
      document.getElementById("set-logo").value = me.logo_url || "";
    });
  }
}

// ── Agent actions ─────────────────────────────────────────────────────────────
async function toggleAgent(slug, active) {
  const res = await apiFetch(`/dashboard/agents/${slug}/toggle`, {
    method: "PATCH", body: JSON.stringify({ active }),
  });
  if (res && res.ok) {
    const idx = agents.findIndex(a => a.slug === slug);
    if (idx >= 0) agents[idx].active = active;
    toast(active ? `${slug} activated` : `${slug} deactivated`);
    renderScreen();
  }
}

function openCreateAgent() {
  editingAgentSlug = null;
  document.getElementById("agent-modal-title").textContent = "Create Agent";
  ["ag-slug","ag-name","ag-icon","ag-desc","ag-prompt","ag-rag-types","ag-keywords"].forEach(id => {
    document.getElementById(id).value = "";
  });
  document.getElementById("ag-icon").value = "🤖";
  document.getElementById("ag-temp").value = "0.4";
  document.getElementById("ag-tokens").value = "500";
  document.getElementById("ag-slug").removeAttribute("disabled");
  document.getElementById("agent-modal").classList.add("open");
}

function editAgent(slug) {
  const a = agents.find(a => a.slug === slug);
  if (!a) return;
  editingAgentSlug = slug;
  document.getElementById("agent-modal-title").textContent = "Edit Agent";
  document.getElementById("ag-slug").value = a.slug;
  document.getElementById("ag-slug").setAttribute("disabled", "true");
  document.getElementById("ag-name").value = a.name;
  document.getElementById("ag-icon").value = a.icon || "🤖";
  document.getElementById("ag-desc").value = a.description || "";
  document.getElementById("ag-prompt").value = a.system_prompt || "";
  document.getElementById("ag-temp").value = a.temperature || 0.4;
  document.getElementById("ag-tokens").value = a.max_tokens || 500;
  document.getElementById("ag-rag-types").value = (a.rag_doc_types || []).join(", ");
  document.getElementById("ag-keywords").value = (a.keywords || []).join(", ");
  document.getElementById("agent-modal").classList.add("open");
}

async function saveAgent() {
  const payload = {
    slug: document.getElementById("ag-slug").value.trim(),
    name: document.getElementById("ag-name").value.trim(),
    icon: document.getElementById("ag-icon").value.trim() || "🤖",
    description: document.getElementById("ag-desc").value.trim(),
    system_prompt: document.getElementById("ag-prompt").value.trim(),
    temperature: parseFloat(document.getElementById("ag-temp").value) || 0.4,
    max_tokens: parseInt(document.getElementById("ag-tokens").value) || 500,
    rag_doc_types: document.getElementById("ag-rag-types").value.split(",").map(s=>s.trim()).filter(Boolean),
    keywords: document.getElementById("ag-keywords").value.split(",").map(s=>s.trim()).filter(Boolean),
  };
  const url = editingAgentSlug ? `/dashboard/agents/${editingAgentSlug}` : "/dashboard/agents";
  const method = editingAgentSlug ? "PATCH" : "POST";
  const res = await apiFetch(url, { method, body: JSON.stringify(payload) });
  if (res && res.ok) {
    const updated = await res.json();
    if (editingAgentSlug) {
      const idx = agents.findIndex(a => a.slug === editingAgentSlug);
      if (idx >= 0) agents[idx] = updated;
    } else {
      agents.push(updated);
    }
    closeModal("agent-modal");
    toast("Agent saved.");
    renderScreen();
  } else {
    const err = res ? await res.json() : {};
    toast("Error: " + (err.detail || "Save failed"));
  }
}

async function deleteAgent(slug) {
  if (!confirm(`Delete agent '${slug}'?`)) return;
  const res = await apiFetch(`/dashboard/agents/${slug}`, { method: "DELETE" });
  if (res && (res.ok || res.status === 204)) {
    agents = agents.filter(a => a.slug !== slug);
    toast("Agent deleted.");
    renderScreen();
  }
}

// ── Skill actions ─────────────────────────────────────────────────────────────
async function saveSkill() {
  const payload = {
    name: document.getElementById("sk-name").value.trim(),
    description: document.getElementById("sk-desc").value.trim(),
    skill_type: document.getElementById("sk-type").value,
    prompt_text: document.getElementById("sk-text").value.trim(),
  };
  const res = await apiFetch("/dashboard/skills", { method: "POST", body: JSON.stringify(payload) });
  if (res && res.ok) {
    skills.push(await res.json());
    closeModal("skill-modal");
    toast("Skill created.");
    renderScreen();
  }
}

async function deleteSkill(id) {
  if (!confirm("Delete this skill?")) return;
  const res = await apiFetch(`/dashboard/skills/${id}`, { method: "DELETE" });
  if (res && (res.ok || res.status === 204)) {
    skills = skills.filter(s => s.id !== id);
    toast("Skill deleted.");
    renderScreen();
  }
}

// ── KB upload ─────────────────────────────────────────────────────────────────
function openUpload() {
  stagedFiles = [];
  document.getElementById("up-staged").innerHTML = "";
  document.getElementById("up-progress").style.display = "none";
  document.getElementById("upload-modal").classList.add("open");
}

const dropZone = document.getElementById("up-drop");
dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
dropZone.addEventListener("drop", e => { e.preventDefault(); dropZone.classList.remove("drag-over"); onFilePick(e.dataTransfer.files); });

function onFilePick(files) {
  stagedFiles = [...stagedFiles, ...Array.from(files)];
  const staged = document.getElementById("up-staged");
  staged.innerHTML = stagedFiles.map((f,i) => `
    <div style="display:flex;align-items:center;gap:8px;font-size:.8rem;background:var(--bg);padding:6px 10px;border-radius:6px">
      <span>📄</span><span style="flex:1">${f.name}</span>
      <span style="color:var(--muted)">${(f.size/1024).toFixed(1)}KB</span>
      <button class="btn" style="padding:2px 8px;font-size:.7rem" onclick="stagedFiles.splice(${i},1);onFilePick([])">✕</button>
    </div>`).join("");
}

async function doUpload() {
  if (!stagedFiles.length) { toast("No files selected."); return; }
  const docType = document.getElementById("up-type").value;
  const progress = document.getElementById("up-progress");
  const bar = document.getElementById("up-bar");
  const status = document.getElementById("up-status");
  progress.style.display = "block";
  document.getElementById("up-btn").disabled = true;

  for (let i = 0; i < stagedFiles.length; i++) {
    const f = stagedFiles[i];
    status.textContent = `Uploading ${f.name} (${i+1}/${stagedFiles.length})…`;
    bar.style.width = `${Math.round((i/stagedFiles.length)*100)}%`;
    const fd = new FormData();
    fd.append("files", f);
    await fetch(`${API}/admin/clients/${brandSlug}/knowledge-base?doc_type=${docType}`, {
      method: "POST",
      headers: { "Authorization": `Bearer ${token}` },
      body: fd,
    });
  }
  bar.style.width = "100%";
  status.textContent = "Done!";
  // Refresh kb list
  const kbRes = await apiFetch(`/admin/clients/${brandSlug}/knowledge-base`);
  if (kbRes && kbRes.ok) kbDocs = await kbRes.json();
  setTimeout(() => {
    closeModal("upload-modal");
    toast("Upload complete.");
    if (currentScreen === "kb") renderScreen();
  }, 800);
  document.getElementById("up-btn").disabled = false;
}

async function deleteDoc(docId) {
  if (!confirm("Delete this document?")) return;
  await apiFetch(`/admin/clients/${brandSlug}/knowledge-base/${docId}`, { method: "DELETE" });
  kbDocs = kbDocs.filter(d => d.doc_id !== docId);
  toast("Document deleted.");
  renderScreen();
}

// ── Settings ──────────────────────────────────────────────────────────────────
async function saveProfile() {
  const payload = {
    display_name: document.getElementById("set-name").value.trim() || undefined,
    theme_color: document.getElementById("set-color").value.trim() || undefined,
    logo_url: document.getElementById("set-logo").value.trim() || null,
  };
  const res = await apiFetch("/dashboard/profile", { method: "PATCH", body: JSON.stringify(payload) });
  if (res && res.ok) toast("Profile updated.");
}

// ── Modal helper ──────────────────────────────────────────────────────────────
function closeModal(id) { document.getElementById(id).classList.remove("open"); }
document.querySelectorAll(".overlay").forEach(el => {
  el.addEventListener("click", e => { if (e.target === el) el.classList.remove("open"); });
});

// ── Init ──────────────────────────────────────────────────────────────────────
loadAll();
</script>
</body>
</html>
