<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Orchestra — Brand Login</title>
  <style>
    :root{--bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--accent:#6366f1;--danger:#ef4444}
    [data-theme="dark"]{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--accent:#818cf8}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px;width:420px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
    .logo{font-size:1.5rem;font-weight:700;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:8px}
    .subtitle{color:var(--muted);font-size:.875rem;margin-bottom:28px}
    .tabs{display:flex;gap:4px;background:var(--bg);border-radius:8px;padding:4px;margin-bottom:24px}
    .tab{flex:1;padding:8px;text-align:center;border-radius:6px;cursor:pointer;font-size:.875rem;color:var(--muted);transition:.15s}
    .tab.active{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
    .form-group{margin-bottom:14px}
    label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:4px}
    input{width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.875rem;outline:none}
    input:focus{border-color:var(--accent)}
    .btn{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:.15s;margin-top:6px}
    .btn:hover{opacity:.9}
    .btn:disabled{opacity:.5;cursor:default}
    .error{color:var(--danger);font-size:.8rem;margin-top:8px;display:none}
    .theme-btn{position:fixed;top:16px;right:16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.8rem;color:var(--text)}
  </style>
</head>
<body>
<button class="theme-btn" onclick="toggleTheme()">🌙 Theme</button>
<div class="card">
  <div class="logo"><span>🎼</span> Orchestra</div>
  <div class="subtitle">Brand management portal</div>

  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">Sign In</div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">Register</div>
  </div>

  <!-- Login form -->
  <div id="form-login">
    <div class="form-group"><label>Email</label><input type="email" id="l-email" placeholder="you@brand.com"/></div>
    <div class="form-group"><label>Password</label><input type="password" id="l-pass" placeholder="••••••••"/></div>
    <button class="btn" id="l-btn" onclick="doLogin()">Sign In</button>
    <div class="error" id="l-error"></div>
  </div>

  <!-- Register form -->
  <div id="form-register" style="display:none">
    <div class="form-group"><label>Brand Slug <span style="font-weight:400;color:var(--muted)">(URL-safe, e.g. acme-corp)</span></label><input type="text" id="r-slug" placeholder="acme-corp"/></div>
    <div class="form-group"><label>Display Name</label><input type="text" id="r-name" placeholder="Acme Corp"/></div>
    <div class="form-group"><label>Email</label><input type="email" id="r-email" placeholder="you@brand.com"/></div>
    <div class="form-group"><label>Password</label><input type="password" id="r-pass" placeholder="Min 8 characters"/></div>
    <button class="btn" id="r-btn" onclick="doRegister()">Create Account</button>
    <div class="error" id="r-error"></div>
  </div>
</div>

<script>
const API = "/api/v1";

// Theme
const saved = localStorage.getItem("theme") || "light";
document.documentElement.setAttribute("data-theme", saved);
function toggleTheme() {
  const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem("theme", t);
}

function switchTab(tab) {
  document.getElementById("form-login").style.display = tab === "login" ? "" : "none";
  document.getElementById("form-register").style.display = tab === "register" ? "" : "none";
  document.getElementById("tab-login").classList.toggle("active", tab === "login");
  document.getElementById("tab-register").classList.toggle("active", tab === "register");
}

// Enter key
document.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const active = document.getElementById("form-login").style.display !== "none" ? "login" : "register";
    if (active === "login") doLogin();
    else doRegister();
  }
});

async function doLogin() {
  const email = document.getElementById("l-email").value.trim();
  const password = document.getElementById("l-pass").value;
  const errEl = document.getElementById("l-error");
  const btn = document.getElementById("l-btn");
  errEl.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Signing in…";

  try {
    const res = await fetch(`${API}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Login failed");
    localStorage.setItem("orchestra_token", data.token);
    localStorage.setItem("orchestra_slug", data.brand?.slug || "");
    window.location.href = "/org/dashboard";
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Sign In";
  }
}

async function doRegister() {
  const slug = document.getElementById("r-slug").value.trim();
  const display_name = document.getElementById("r-name").value.trim();
  const email = document.getElementById("r-email").value.trim();
  const password = document.getElementById("r-pass").value;
  const errEl = document.getElementById("r-error");
  const btn = document.getElementById("r-btn");
  errEl.style.display = "none";

  if (!slug || !display_name || !email || !password) {
    errEl.textContent = "All fields are required.";
    errEl.style.display = "block";
    return;
  }
  btn.disabled = true;
  btn.textContent = "Creating…";

  try {
    const res = await fetch(`${API}/auth/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ slug, display_name, email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Registration failed");
    localStorage.setItem("orchestra_token", data.token);
    localStorage.setItem("orchestra_slug", data.brand?.slug || "");
    window.location.href = "/org/dashboard";
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Create Account";
  }
}
</script>
</body>
</html>
